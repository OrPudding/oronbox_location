name: oronbox_location
description: A lightweight Flutter plugin providing native location support for OronBox
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: org.zxor.oronbox_location
        pluginClass: OronboxLocationPlugin
      ios:
        pluginClass: OronboxLocationPlugin
